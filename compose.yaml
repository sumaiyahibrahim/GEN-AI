services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    # No host port is exposed for the inference server.
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_MODEL: qwen2.5:1.5b
      EMBED_MODEL: nomic-embed-text
    volumes:
      - app_data:/app/.runtime
    depends_on:
      - ollama
volumes:
  ollama_models:
  app_data:
